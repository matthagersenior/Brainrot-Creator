name: Test and deploy Brainrot Creator

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: "brainrot-${{ github.ref }}"
  cancel-in-progress: true

env:
  CLOUDFLARE_PAGES_PROJECT: brainrot-creator

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test

  deploy-github-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-cloudflare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Check Cloudflare credentials
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deployment is ready but waiting for CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN repository secrets."
          fi

      - name: Checkout
        if: steps.cloudflare.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.cloudflare.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ensure Cloudflare Pages project exists
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          project_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}"
          status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/pages-project.json" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "$project_url")"

          if [[ "$status" == "200" ]]; then
            echo "Cloudflare Pages project $CLOUDFLARE_PAGES_PROJECT already exists."
          elif [[ "$status" == "404" ]]; then
            npx --yes wrangler@4 pages project create "$CLOUDFLARE_PAGES_PROJECT" --production-branch=main
          else
            echo "Cloudflare project lookup failed with HTTP $status."
            cat "$RUNNER_TEMP/pages-project.json"
            exit 1
          fi

      - name: Sync Gemini key to Cloudflare
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          if [[ -n "$GEMINI_API_KEY" ]]; then
            printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@4 pages secret put GEMINI_API_KEY --project-name="$CLOUDFLARE_PAGES_PROJECT"
          else
            echo "::notice::GEMINI_API_KEY is not set yet. Cloudflare will deploy with the app's local/device-voice fallback."
          fi

      - name: Prepare static assets
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          rm -rf .pages-dist
          mkdir .pages-dist
          cp index.html styles.css app.mjs app-core.mjs _headers .pages-dist/

      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          npx --yes wrangler@4 pages deploy .pages-dist \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty=true

      - name: Smoke test Cloudflare production
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="https://${CLOUDFLARE_PAGES_PROJECT}.pages.dev"

          echo "Waiting for Cloudflare production alias to serve this build..."
          alias_ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$base/" > "$RUNNER_TEMP/page.html" \
              && grep -q 'ROT MACHINE' "$RUNNER_TEMP/page.html" \
              && grep -q 'visualStyleSelect' "$RUNNER_TEMP/page.html"; then
              alias_ready=true
              echo "Cloudflare production alias is current on attempt $attempt."
              break
            fi
            sleep 2
          done
          if [[ "$alias_ready" != "true" ]]; then
            echo "Cloudflare production alias did not serve the new build marker after 30 attempts."
            exit 1
          fi
          echo "Live page passed."

          curl --fail --silent --show-error --retry 6 --retry-delay 2 --retry-all-errors \
            "$base/api/trends" > "$RUNNER_TEMP/trends.json"
          jq -e '.source and (.trends | type == "array")' "$RUNNER_TEMP/trends.json" >/dev/null
          echo "Trend endpoint passed."

          visual_status="$(curl --silent --show-error --max-time 45 \
            --output "$RUNNER_TEMP/visual.json" \
            --write-out '%{http_code}' \
            -X POST "$base/api/visualize" \
            -H 'content-type: application/json' \
            --data '{"visualPrompt":"Cursed realistic frog waiting inside an American DMV, believable live-action photography, vertical 9:16, no text, no logos, no watermarks","style":"cursed-real","seed":42}')"
          if [[ "$visual_status" != "200" ]]; then
            echo "Workers AI scene visual endpoint failed with HTTP $visual_status:"
            cat "$RUNNER_TEMP/visual.json"
            exit 1
          fi
          jq -e '(.source == "cloudflare-flux-1-schnell") and (.dataURI | startswith("data:image/jpeg;base64,")) and (.dataURI | length > 1000)' "$RUNNER_TEMP/visual.json" >/dev/null
          echo "Workers AI scene visual endpoint passed with a real image payload."

          story_status="$(curl --silent --show-error --max-time 75 \
            --output "$RUNNER_TEMP/story.json" \
            --write-out '%{http_code}' \
            -X POST "$base/api/story" \
            -H 'content-type: application/json' \
            --data '{"prompt":"frog at the DMV","visualStyle":"cursed-real"}')"
          if [[ "$story_status" != "200" ]]; then
            echo "Story endpoint failed with HTTP $story_status:"
            cat "$RUNNER_TEMP/story.json"
            exit 1
          fi
          jq -e '(.source | startswith("gemini-")) and (.visualStyle == "cursed-real") and (.scenes | length == 8)' "$RUNNER_TEMP/story.json" >/dev/null
          echo "Gemini story endpoint passed."

          narrate_status="$(curl --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors \
            --output "$RUNNER_TEMP/narrate.json" \
            --write-out '%{http_code}' \
            -X POST "$base/api/narrate" \
            -H 'content-type: application/json' \
            --data '{"text":"Testing the Brainrot narrator."}')"
          if [[ "$narrate_status" != "200" ]]; then
            echo "Narration endpoint failed with HTTP $narrate_status:"
            cat "$RUNNER_TEMP/narrate.json"
            exit 1
          fi
          jq -e '(.source | startswith("gemini-")) and (.sampleRate == 24000) and (.pcmBase64 | length > 1000)' "$RUNNER_TEMP/narrate.json" >/dev/null
          echo "Gemini narration endpoint passed."

          echo "Cloudflare production smoke test passed: page, trends, real FLUX image, structured story, and narration."
