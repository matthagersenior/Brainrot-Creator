name: Test and deploy Brainrot Creator

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: "brainrot-${{ github.ref }}"
  cancel-in-progress: true

env:
  CLOUDFLARE_PAGES_PROJECT: brainrot-creator

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test

  deploy-github-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-cloudflare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Check Cloudflare credentials
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deployment is ready but waiting for CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN repository secrets."
          fi

      - name: Checkout
        if: steps.cloudflare.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.cloudflare.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ensure Cloudflare Pages project exists
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          npx --yes wrangler@4 pages project list --json > "$RUNNER_TEMP/pages-projects.json"
          if jq -e --arg project "$CLOUDFLARE_PAGES_PROJECT" '.. | objects | select(.name? == $project)' "$RUNNER_TEMP/pages-projects.json" >/dev/null; then
            echo "Cloudflare Pages project $CLOUDFLARE_PAGES_PROJECT already exists."
          else
            npx --yes wrangler@4 pages project create "$CLOUDFLARE_PAGES_PROJECT" --production-branch=main
          fi

      - name: Sync Gemini key to Cloudflare
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          if [[ -n "$GEMINI_API_KEY" ]]; then
            printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@4 pages secret put GEMINI_API_KEY --project-name="$CLOUDFLARE_PAGES_PROJECT"
          else
            echo "::notice::GEMINI_API_KEY is not set yet. Cloudflare will deploy with the app's local/device-voice fallback."
          fi

      - name: Prepare static assets
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          rm -rf .pages-dist
          mkdir .pages-dist
          cp index.html styles.css app.mjs app-core.mjs _headers .pages-dist/

      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          npx --yes wrangler@4 pages deploy .pages-dist \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" \
            --branch=main \
            --commit-hash="$GITHUB_SHA"
