name: Inspect Cloudflare Pages production routing

on:
  push:
    branches: ["verify/live-anonymous-image"]

jobs:
  inspect-pages-project:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROJECT: brainrot-creator
    steps:
      - name: Inspect project and latest deployments
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT"             > "$RUNNER_TEMP/project.json"
          jq '{production_branch:.result.production_branch,subdomain:.result.subdomain,source:.result.source}' "$RUNNER_TEMP/project.json"

          curl --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments?per_page=10"             > "$RUNNER_TEMP/deployments.json"
          jq '[.result[] | {id,environment,url,branch:.deployment_trigger.metadata.branch,commit_hash:.deployment_trigger.metadata.commit_hash,latest_stage:(.latest_stage.name // null),stage_status:(.latest_stage.status // null)}]' "$RUNNER_TEMP/deployments.json"
