name: Compare Cloudflare production and deployment function

on:
  push:
    branches: ["verify/live-anonymous-image"]

jobs:
  compare-function-routing:
    runs-on: ubuntu-latest
    steps:
      - name: Compare provider response on immutable deployment and alias
        shell: bash
        run: |
          set -u
          body='{"provider":"pollinations","visualPrompt":"photorealistic young traveler lost in an Ohio cornfield at dusk, holding phone GPS, clear subject, vertical 9:16, no text","model":"flux","seed":42}'
          for base in "https://418d53ba.brainrot-creator.pages.dev" "https://brainrot-creator.pages.dev"; do
            echo "=== $base ==="
            status="$(curl --silent --show-error --max-time 70               --output "$RUNNER_TEMP/response.json"               --write-out '%{http_code}'               -X POST "$base/api/horde-image"               -H 'content-type: application/json'               --data "$body")"
            echo "HTTP $status"
            jq '{source,model,error,detail,bytes,dataLength:(.dataURI // "" | length)}' "$RUNNER_TEMP/response.json" || cat "$RUNNER_TEMP/response.json"
          done
