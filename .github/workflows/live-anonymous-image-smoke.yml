name: Verify live quality image broker

on:
  push:
    branches: ["verify/live-anonymous-image"]

jobs:
  verify-live-quality-broker:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production Pollinations broker response
        shell: bash
        run: |
          set -u
          base="https://brainrot-creator.pages.dev"
          status="$(curl --silent --show-error --max-time 70             --output "$RUNNER_TEMP/fallback.json"             --write-out '%{http_code}'             -X POST "$base/api/horde-image"             -H 'content-type: application/json'             --data '{"provider":"pollinations","visualPrompt":"photorealistic young traveler lost in an Ohio cornfield at dusk, holding a phone GPS, clear human subject, realistic landscape, vertical 9:16, no text, no logos, no signs","model":"flux","seed":42}')"
          echo "HTTP $status"
          cat "$RUNNER_TEMP/fallback.json" | jq '{source,model,error,detail,bytes,dataLength:(.dataURI // "" | length),prefix:(.dataURI // "" | .[0:40])}'
          test "$status" = "200"
