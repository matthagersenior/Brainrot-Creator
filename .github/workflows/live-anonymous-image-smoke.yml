name: Inspect Cloudflare canonical deployment

on:
  push:
    branches: ["verify/live-anonymous-image"]

jobs:
  inspect-canonical:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROJECT: brainrot-creator
    steps:
      - name: Inspect canonical deployment and configs
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT"             > "$RUNNER_TEMP/project.json"
          jq '{
            production_branch:.result.production_branch,
            canonical_deployment:{
              id:.result.canonical_deployment.id,
              url:.result.canonical_deployment.url,
              environment:.result.canonical_deployment.environment,
              branch:.result.canonical_deployment.deployment_trigger.metadata.branch,
              commit_hash:.result.canonical_deployment.deployment_trigger.metadata.commit_hash,
              aliases:.result.canonical_deployment.aliases
            },
            deployment_configs:.result.deployment_configs
          }' "$RUNNER_TEMP/project.json"
