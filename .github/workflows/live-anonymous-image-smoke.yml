name: Inspect deployed Pages Worker bundle

on:
  push:
    branches: ["verify/live-anonymous-image"]

jobs:
  inspect-worker:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SCRIPT: pages-worker--19137760-production
    steps:
      - name: Inspect deployed production Worker script markers
        shell: bash
        run: |
          set -u
          status="$(curl --silent --show-error             --output "$RUNNER_TEMP/worker.bin"             --write-out '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$SCRIPT")"
          echo "Worker fetch HTTP $status"
          echo "bytes=$(wc -c < "$RUNNER_TEMP/worker.bin")"
          for marker in 'POLLINATIONS_BASE' 'pollinationsGenerate' 'provider ||' 'HORDE_TIMEOUT' 'AI Horde'; do
            if grep -a -q "$marker" "$RUNNER_TEMP/worker.bin"; then
              echo "FOUND: $marker"
            else
              echo "MISSING: $marker"
            fi
          done
